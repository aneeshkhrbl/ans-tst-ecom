# ==========================================
# INGRESS ROUTING RULES (Host-Based)
# ==========================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: ans-tst-ecom.com   # Ensures rules only apply to this exact domain
    http:
      paths:
      # 1. Health Probe Route (Catches the root traffic from AppGW)
      - path: /()(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: health-service
            port:
              number: 80
      # 2. Application Routes
      - path: /auth(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: auth-service
            port:
              number: 80
      - path: /catalog(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: catalog-service
            port:
              number: 80
      - path: /ordering(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: ordering-service
            port:
              number: 80
      - path: /payment(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: payment-service
            port:
              number: 80